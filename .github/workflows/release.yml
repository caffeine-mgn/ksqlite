name: Release to Maven Central

# Tag-triggered: any pushed tag of the form N.N.N (or N.N.N-suffix) starts
# a Sonatype Central publish. Workflow expects GITHUB_REF_NAME to be the
# tag itself so build.gradle.kts can pick it up as the project version.
#
# We run on macos-latest because the Kotlin Multiplatform plugin disables
# Apple targets (iOS, tvOS, watchOS, macOS) on non-macOS hosts. On a Mac
# runner K/N's bundled clang can cross-compile the SQLite + sqlite-vec
# amalgamation to every Linux / Android / Mingw target as well, so one
# runner covers the whole matrix.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: liberica

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ksqlite links a SQLite + sqlite-vec amalgamation straight into
      # every native klib via clangBuildStatic, and on the JVM clangBuildDynamic
      # produces the .dylib that NativeLoader extracts at runtime. Both
      # call into clang from the Kotlin/Native distribution (via the
      # kn-clang plugin), so no system clang is needed — but we still
      # want autoconf / make available for any plugin step that shells
      # out to configure scripts.
      - name: Install build prerequisites
        run: |
          brew update
          brew install autoconf automake libtool pkg-config

      # The GPG key is base64-encoded so it survives transport through
      # GitHub Actions secrets (newlines etc. are preserved verbatim).
      - name: Import GPG key
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSWORD }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          printf '%b' "$GPG_KEY" | base64 -d | gpg --batch --import --passphrase "$GPG_PASSPHRASE"
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpgconf --reload gpg-agent

      # The vanniktech plugin reads mavenCentralUsername / mavenCentralPassword
      # from Gradle properties; we forward them from secrets. The same
      # applies to the GPG triplet: signingInMemoryKey{,Id,Password,
      # IsBase64=true}.
      - name: Publish to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          ./gradlew publishToMavenCentral \
            -Pversion=${{ github.ref_name }} \
            -PmavenCentralUsername="$MAVEN_CENTRAL_USERNAME" \
            -PmavenCentralPassword="$MAVEN_CENTRAL_PASSWORD" \
            -PsigningInMemoryKey="$GPG_PRIVATE_KEY" \
            -PsigningInMemoryKeyId="$GPG_KEY_ID" \
            -PsigningInMemoryKeyPassword="$GPG_PASSWORD" \
            -PsigningInMemoryKeyIsBase64=true
