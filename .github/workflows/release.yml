name: Release to Maven Central

# Tag-triggered: any pushed tag of the form N.N.N (or N.N.N-suffix) starts
# a Sonatype Central publish. Workflow expects GITHUB_REF_NAME to be the
# tag itself so build.gradle.kts can pick it up as the project version.
#
# Conventions mirror the rest of the caffeine-mgn/* repos (kdns,
# kn-clang-compiler-plugin): `ubuntu-latest` runner, GPG key imported into
# the system keyring once at job start, the `signingUseGpg` flag in
# build.gradle.kts flips the build over to `useGpgCmd()`, and the
# Sonatype user token plus GPG key id / passphrase are forwarded as
# `-PmavenCentral*` / `-Psigning.gnupg.*` Gradle properties.
#
# Apple targets (iOS / tvOS / watchOS / macOS) are declared in
# build.gradle.kts but auto-disabled on Linux hosts by the Kotlin
# Multiplatform plugin, so this CI publishes the JVM + Linux + Android +
# Mingw slice. Apple klibs are built locally on a Mac when needed; that
# also matches the kdns / kn-clang-compiler-plugin setup where the CI
# never claims to cover Apple.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: liberica

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ksqlite links a SQLite + sqlite-vec amalgamation straight into
      # every native klib via clangBuildStatic, and on the JVM clangBuildDynamic
      # produces the .so that NativeLoader extracts at runtime. Linux
      # toolchain packages are needed for both: gcc/clang for the
      # plugin and the regular Linux JDK headers for JNI.
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang mingw-w64

      # The GPG private key is stored in GitHub secrets with literal `\n`
      # escapes (one-line encoding). `printf '%b'` interprets those
      # escapes, the import is non-interactive (`--batch --pinentry-mode
      # loopback`) and we let the agent know it's allowed to use the
      # loopback pinentry.
      - name: Import GPG key
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSWORD }}
        run: |
          printf '%b' "$GPG_KEY" | gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --import
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpgconf --reload gpg-agent

      - name: Publish to Maven Central
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
        run: |
          ./gradlew publishToMavenCentral \
            -Pversion=${{ github.ref_name }} \
            -PsigningUseGpg=true \
            -Psigning.gnupg.keyName="$GPG_KEY_ID" \
            -Psigning.gnupg.passphrase="$GPG_PASSWORD" \
            -PmavenCentralUsername=${{ secrets.CENTRAL_USENAME }} \
            -PmavenCentralPassword=${{ secrets.CENTRAL_PASSWORD }}
